name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Start RDP setup
        run: |
          Write-Host "=== RDP setup starting ==="
          Write-Host "Runner: $env:COMPUTERNAME"
          Write-Host "Run ID: $env:GITHUB_RUN_ID"

      - name: Enable Remote Desktop
        run: |
          Write-Host "Enabling Remote Desktop..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "Remote Desktop enabled, port 3389 open."

      - name: Create RDP user
        run: |
          Write-Host "Creating RDP user..."
          $upper = [char[]](65..90)
          $lower = [char[]](97..122)
          $digits = [char[]](48..57)
          $special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          $chars = @()
          $chars += $upper | Get-Random -Count 4
          $chars += $lower | Get-Random -Count 4
          $chars += $digits | Get-Random -Count 4
          $chars += $special | Get-Random -Count 4
          $password = -join ($chars | Sort-Object { Get-Random })
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          Write-Host "RDP user created."

      - name: Install Tailscale
        run: |
          Write-Host "Installing Tailscale..."
          winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements --silent
          Write-Host "Tailscale installed."

      - name: Connect Tailscale
        run: |
          Write-Host "Connecting Tailscale..."
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-rdp-$env:GITHUB_RUN_ID
          $ip = $null
          for ($i = 0; $i -lt 12 -and -not $ip; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) { Write-Error "Tailscale IP not assigned"; exit 1 }
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale connected: $ip"

      - name: Check RDP port
        run: |
          Write-Host "Checking RDP on $($env:TAILSCALE_IP):3389 ..."
          $ok = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $ok.TcpTestSucceeded) { Write-Error "Port 3389 not reachable"; exit 1 }
          Write-Host "RDP port reachable."

      - name: Show RDP details and keep alive
        run: |
          Write-Host ""
          Write-Host "===== RDP ACCESS ====="
          Write-Host "Address : $($env:TAILSCALE_IP)"
          Write-Host "Username: RDP"
          Write-Host "Password: $($env:RDP_PASSWORD)"
          Write-Host "======================"
          Write-Host ""
          while ($true) {
            Write-Host "[$(Get-Date)] RDP running - cancel the workflow to stop it"
            Start-Sleep -Seconds 300
          }
